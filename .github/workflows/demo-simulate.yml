name: Demo Simulation - Proyecto X

# Ejecutar cada 30 minutos de Lunes a Sábado, 9am-2am UTC (5am-10pm Bolivia)
# Zona horaria Bolivia (UTC-4): cron usa UTC
on:
  schedule:
    # Cada 30 minutos, 9-23 UTC = 5am-7pm Bolivia, Lunes-Sábado
    - cron: '*/30 9-23 * * 1-6'
    # Cada 30 minutos, 0-2 UTC = 8pm-10pm Bolivia, Lunes-Sábado
    - cron: '*/30 0-2 * * 2-7'
  workflow_dispatch: {}  # Permite ejecutar manualmente

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Simulate Demo Activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_SITE_ID: 'd67ff32e-5094-4d2a-ad3c-8d6f7ae07e37'
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/rpc/simulate_demo_activity" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_site_id\": \"${DEMO_SITE_ID}\"}")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "::error::Simulation failed with HTTP $http_code"
            exit 1
          fi
